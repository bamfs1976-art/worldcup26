# World Cup 2026 — unified app (Wall Chart + Stats Desk + Fantasy).
# Static index.html + /data/*.js, no build step. Deploy by folder upload.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
